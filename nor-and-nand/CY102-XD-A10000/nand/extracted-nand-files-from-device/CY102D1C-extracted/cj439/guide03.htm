<p class="head(1,3)">ルビについて</p>
<p class="head(3,3)">英語の発音に慣れていない人のために､本書では会話例の英文の発音がルビ(カタカナ)で示されています｡強く発音する部分は太字で､きわめて弱く発音する部分は小文字で書かれていますので､実際に声に出して言うときに､文脈の中でどこに強弱をおいたらいいかのひとつの目安にしてください｡また､会話の流れの中で表れる高低変化のうち､一般疑問文でよくあるような上昇調のイントネーションは&F19F;の印で示しました｡ただ､英語の発音に対して完全に正確なルビをつけることはできませんので､本書のルビはあくまでも発音の目安にすぎません｡</p>
