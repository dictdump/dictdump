<p class="head(1,1)">2 見出し語の表記</p>
<p class="head(1,5)">2.1 &F979;　&F97A;の中に,見出し語の漢字を用いた一般通用の書き表し方を示した.ただし,動･植物名は原則として漢字表記を省いた.</p>
<p class="head(1,5)">2.2 &F04A;　&F04B;の中には外来語のもとの外国語を適宜示した.外国語の頭に付けた半角の<font size="1">ド･フ･イ</font>などはドイツ語･フランス語･イタリア語などの意味で,ないものは英語である.</p>
<p class="head(1,5)">2.3 日本語と外国語とが合成されてできた語はつぎのように示した.</p>
<p class="head(5,5)">　アートし&F979;―紙&F97A;</p>
<p class="head(5,5)">　｢―｣部分はもとの外国語綴りを省略した意味である.</p>
