<p class="list(1,3)">●リエゾン</p>
<p class="list(3,3)">フランス語では､前の語が子音で終わり次の語が母音で始まるとき､その2つをつなげて発音します｡これをリエゾンといいます｡</p>
<p class="list(3,3)">例)</p>
<p class="list(3,3)"><b>mon ami</b>(私の友だち)</p>
<p class="list(3,3)"><font size="1">モ　 ナミ</font></p>
<p class="list(3,3)"><b>son &EC76;ge</b>(彼の年齢)</p>
<p class="list(3,3)"><font size="1">ソ　 ナージュ</font></p>
<p class="list(3,3)">ただし､次の場合はリエゾンしません｡</p>
<p class="list(5,5)">主語(名詞)+動詞</p>
<p class="list(5,5)">接続詞<b>et</b>とその次にくる語</p>
<p class="list(1,3)">●アクセント</p>
<p class="list(3,3)">太字はアクセントです｡フランス語はほとんど抑揚がありませんが､読むときのリズムがわかりやすいように本機では太字で表記しています｡質問など疑問文は常に語尾を上げます｡</p>
