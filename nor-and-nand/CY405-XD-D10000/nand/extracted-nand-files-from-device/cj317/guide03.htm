<p class="head(1,1)">III．地図から検索について</p>
<p class="head(1,3)">・地図から検索に収録している都市，山，川などの項目は人口，標高，延長などの上位から順に代表的なものを，世界遺産はよく知られているものを，それぞれ各地域ごとに選んでいます。世界遺産は，その場所にある世界遺産の説明がある項目を参照しています。</p>
<p class="head(1,3)">・地図上の地形，都市，山，川，湖などは，おおまかな形と位置を示しています。</p>
<p class="head(1,3)">・地図から検索の地域分類と地域名は，世界地図および日本地図を見やすく分割したものになっています。地理学上の定義に基づいたものではありません。</p>
