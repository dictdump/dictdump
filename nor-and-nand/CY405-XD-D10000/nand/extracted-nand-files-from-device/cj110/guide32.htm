<p class="list(1,3)">■時代区分について</p>
<p class="list(3,3)">原則として､本コンテンツの時代区分は､</p>
<p class="list(3,3)">原始(旧石器･縄文･弥生)→古代(大和･飛鳥･奈良･平安)→中世(鎌倉･南北朝･室町･戦国)→近世(安土桃山･江戸前期･江戸中期･江戸後期･幕末)→近代(明治･大正･昭和前期)→現代(昭和後期･平成)</p>
<p class="list(3,3)">となっています｡なお､江戸時代の前期は幕府の成立(1603)から綱吉の襲職(1680)まで｡中期は田沼意次の老中就任(1772)まで｡後期はペリー来航(1853)まで｡以後大政奉還までを幕末とします｡昭和時代の前期はいわゆる戦前(～1940)､後期は戦中～戦後として区別しています｡</p>
