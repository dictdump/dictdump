<p class="head(1,3)">&F154;見出し語の範囲</p>
<p class="head(3,5)">1 外来語および和製英語･和製洋語とその混種語(カタカナ語+漢語･和語)を収録した｡特に国際化時代､情報化時代に対応して､日常語のほかに経済･経営､先端技術などの専門語､新語を積極的に取り入れた｡一方､外来語としての意識が薄れている語のほか､あまり使われなくなった語や周知の語ははぶいた場合がある｡</p>
<p class="head(3,5)">2 固有名詞はギリシャ･ローマ神話など基礎的な教義に必要な語および"新しい時代"と関連のある語にとどめた｡</p>
