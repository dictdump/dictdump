<p class="head(1,3)"><b>III.</b>格支配</p>
<p class="head(1,3)"><b>7.</b>動詞や形容詞の伴う格･前置詞をイタリック体で示した. <rus><i>кто</i></rus>とその変化形は活動体(人･動物)の,<rus><i>что</i></rus>とその変化形はそれ以外の任意の名詞･代名詞などに置きかえて使うべきことを示す. ｢&F15D;を｣と訳される対格を伴う動詞については表示を略した.</p>
<p class="head(3,6)">例：<rus><i>кому</i></rus><i>-</i><rus><i>чему</i></rus>&F15D;&F15D; すべて与格の補語をとる. <rus><i>с</i></rus><i> </i><rus><i>чем</i></rus>&F15D;&F15D; <rus>с</rus> と非活動体造格をとる.</p>
