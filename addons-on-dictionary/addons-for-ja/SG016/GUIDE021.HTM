<p class="head(1,3)">&F156;.子音</p>
<p class="head(3,3)">破裂音,破擦音,摩擦音には平音(無気音)のほかに濃音(硬音)や激音(有気音)と呼ばれる日本語にはない音がある.その反面,日本語の清音(無声音)に対する濁音(有声音)は特定の条件のもと(母音と母音にはさまれるなど)で現われる音声的現象で,例えば[p]と[b]は別の音とは意識されていない.したがって,[b][d][&F05A;][d&F05C;]などは語頭に立たない(頭音法則).</p>
